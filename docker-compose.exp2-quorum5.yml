# Стенд эксперимента 2 (оверрайд поверх docker-compose.yml):
#   docker compose -f docker-compose.yml -f docker-compose.exp2-quorum5.yml up -d
#
# Те же 3 работающих узла, но в кворуме KRaft объявлено 5 голосов.
# Голоса 4 и 5 (kafka-old-1, kafka-old-2) — «выведенные» серверы: они не запущены и не хранят реплик
# (все данные на брокерах 1-3), но из кворума их не удалили. Большинство — 3 из 5, поэтому кластер
# работает, только пока живы все 3 узла.

# Список голосующих участников кворума: 3 живых узла + 2 несуществующих.
x-quorum5: &quorum5
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093,3@kafka3:29093,4@kafka-old-1:29093,5@kafka-old-2:29093"

# Подменяем список голосов у всех трёх брокеров, остальные настройки берутся из docker-compose.yml.
services:
  kafka1:
    environment: *quorum5
  kafka2:
    environment: *quorum5
  kafka3:
    environment: *quorum5
