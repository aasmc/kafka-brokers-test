# Кластер Kafka 3.9.0 (Confluent Platform 7.9.0) в режиме KRaft combined:
# каждый узел одновременно брокер и контроллер; кворум из 3 голосов.
# Базовый стенд эксперимента 1. Для эксперимента 2 поверх него накладывается docker-compose.exp2-quorum5.yml.
#
# Listener'ы:
#   INTERNAL   kafkaN:29092       - трафик между брокерами и контейнер kafka-tools
#   CONTROLLER kafkaN:29093       - кворум KRaft
#   EXTERNAL   localhost:909[2-4] - Spring Boot сервис, запущенный на хосте

# Общие настройки контейнеров брокеров: образ, без автоперезапуска (падение брокера — часть эксперимента)
# и healthcheck по доступности API брокера.
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.9.0
  restart: "no"
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30

# Общие переменные окружения брокеров (KAFKA_* превращаются в настройки server.properties).
# Важное для экспериментов: RF=3 и min.insync.replicas=2 по умолчанию, автосоздание топиков выключено,
# unclean leader election выключен (лидером может стать только реплика из ISR).
x-kafka-env: &kafka-env
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093,3@kafka3:29093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"

services:
  kafka1:
    <<: *kafka-common
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:29092,CONTROLLER://kafka1:29093,EXTERNAL://localhost:9092"

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:29092,CONTROLLER://kafka2:29093,EXTERNAL://localhost:9093"

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka3:29092,CONTROLLER://kafka3:29093,EXTERNAL://localhost:9094"

  # Не брокер: контейнер с CLI-утилитами Kafka. При старте создаёт топики (scripts/create-topics.sh),
  # затем используется скриптом нагрузки (console producer) и для снимков состояния кластера.
  kafka-tools:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka-tools
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["bash", "-c", "/scripts/create-topics.sh && exec sleep infinity"]
